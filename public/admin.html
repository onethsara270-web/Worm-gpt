<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fixo Admin — Control Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0505;
  --panel:#0c0c0d;
  --stroke:rgba(255,42,42,.15);
  --stroke2:rgba(255,42,42,.3);
  --txt:#f5e9e9;
  --mut:#a88888;
  --acc:#ff2a2a;
  --acc2:#ff5c5c;
  --acc3:#8b0000;
  --ok:#2fe08a;
  --warn:#ffc107;
  --bad:#ff5c5c;
}
body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:rgba(255,42,42,.4);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,42,42,.2);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,42,42,.4)}

/* BACKGROUND FX */
.bg-grid{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(to right, rgba(255,42,42,0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,42,42,0.03) 1px, transparent 1px);
  background-size:40px 40px;
  mask-image:radial-gradient(ellipse 60% 50% at 50% 0%, #000 70%, transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 60% 50% at 50% 0%, #000 70%, transparent 100%);
}
.glow{position:fixed;top:-10%;left:50%;transform:translateX(-50%);width:600px;height:300px;background:rgba(255,42,42,.08);filter:blur(100px);border-radius:50%;z-index:-1;pointer-events:none}

/* LOGIN */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;z-index:2}
.login-card{max-width:400px;width:100%;border:1px solid var(--stroke);border-radius:20px;padding:40px 32px;background:var(--panel);backdrop-filter:blur(20px);box-shadow:0 40px 80px rgba(0,0,0,.8);text-align:center;animation:vin .4s ease}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.login-card .logo{width:48px;height:48px;margin:0 auto 20px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc3));display:grid;place-items:center;box-shadow:0 0 20px rgba(255,42,42,.3)}
.login-card .logo svg{width:28px;height:28px;fill:#0a0505}
.login-card h1{font-family:'Space Grotesk';font-size:24px;margin-bottom:8px;letter-spacing:-.5px}
.login-card p{color:var(--mut);font-size:13px;margin-bottom:28px}
.login-card input{width:100%;padding:14px 16px;border-radius:10px;background:rgba(0,0,0,.4);border:1px solid var(--stroke);color:var(--txt);font-family:'JetBrains Mono';font-size:13px;outline:none;margin-bottom:16px;transition:all .2s;text-align:center}
.login-card input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,42,42,.15)}
.login-card button{width:100%;padding:14px;border-radius:10px;border:none;cursor:pointer;background:#fff;color:#000;font-weight:700;font-size:14px;font-family:'Inter';transition:all .2s}
.login-card button:hover{background:#e0e0e0;transform:scale(1.02)}
.err{color:var(--bad);font-size:12px;margin-top:12px;min-height:16px;font-family:'JetBrains Mono'}

/* DASHBOARD */
.dashboard{display:none;min-height:100vh;flex-direction:column;position:relative;z-index:2}
.dashboard.show{display:flex}
.top-bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:16px 24px;background:rgba(10,5,5,.8);backdrop-filter:blur(16px);border-bottom:1px solid var(--stroke)}
.top-bar .brand{font-family:'Space Grotesk';font-size:16px;font-weight:700;display:flex;align-items:center;gap:12px}
.top-bar .brand .mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--acc3));display:grid;place-items:center;box-shadow:0 0 15px rgba(255,42,42,.3)}
.top-bar .brand .mark svg{width:18px;height:18px;fill:#0a0505}
.top-bar .badge{font-family:'JetBrains Mono';font-size:9px;padding:4px 8px;border-radius:4px;background:rgba(255,42,42,.15);color:var(--acc2);border:1px solid var(--stroke);letter-spacing:1.5px;font-weight:700}
.top-bar .spacer{flex:1}
.top-bar button{padding:8px 16px;border-radius:6px;background:transparent;border:1px solid var(--stroke);color:var(--txt);font-family:'JetBrains Mono';font-size:11.5px;cursor:pointer;transition:all .2s}
.top-bar button:hover{background:rgba(255,42,42,.1);border-color:var(--acc)}

.content{padding:32px 24px;max-width:1200px;margin:0 auto;width:100%}
.section-head{display:flex;align-items:center;gap:16px;margin-bottom:20px;margin-top:12px}
.section-head h2{font-family:'JetBrains Mono';font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
.section-head .line{flex:1;height:1px;background:linear-gradient(90deg,var(--stroke),transparent)}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px}
.stat{border:1px solid var(--stroke);border-radius:12px;padding:20px;background:var(--panel);transition:all .2s}
.stat:hover{border-color:var(--stroke2);transform:translateY(-2px);box-shadow:0 10px 30px -10px rgba(255,42,42,.15)}
.stat .lbl{font-family:'JetBrains Mono';font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--mut);font-weight:600;margin-bottom:12px}
.stat .val{font-family:'Space Grotesk';font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1}
.stat .val.accent{color:var(--acc2);text-shadow:0 0 20px rgba(255,42,42,.4)}
.stat .sub{font-family:'JetBrains Mono';font-size:10.5px;color:#6e5252;margin-top:8px}

.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px}
.chart-card{border:1px solid var(--stroke);border-radius:12px;padding:20px;background:var(--panel)}
.chart-card h3{font-family:'JetBrains Mono';font-size:10.5px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;color:var(--mut);margin-bottom:20px}
.bar-chart{height:120px;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid var(--stroke);padding-bottom:4px}
.bar-chart .bar{flex:1;min-height:2px;background:linear-gradient(180deg,var(--acc2),var(--acc3));border-radius:2px 2px 0 0;transition:all .2s;position:relative;cursor:pointer;opacity:.8}
.bar-chart .bar:hover{opacity:1;filter:brightness(1.2)}
.chart-meta{display:flex;justify-content:space-between;font-family:'JetBrains Mono';font-size:10px;color:#6e5252;margin-top:12px}

.users-controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.users-controls input,.users-controls select{padding:12px 16px;border-radius:8px;background:rgba(0,0,0,.4);border:1px solid var(--stroke);color:var(--txt);font-family:'JetBrains Mono';font-size:12px;outline:none;transition:border .2s}
.users-controls input:focus,.users-controls select:focus{border-color:var(--acc)}
.users-controls input{min-width:180px;flex:1}
.users-controls button{padding:12px 24px;border-radius:8px;border:none;cursor:pointer;background:#fff;color:#000;font-family:'Inter';font-weight:700;font-size:12.5px;transition:all .2s}
.users-controls button:hover{background:#e0e0e0;transform:scale(1.02)}

.users-table{width:100%;border-collapse:collapse;font-size:13px;border:1px solid var(--stroke);border-radius:12px;overflow:hidden;background:var(--panel)}
.users-table th{text-align:left;padding:14px 16px;font-family:'JetBrains Mono';font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--mut);font-weight:600;background:rgba(255,42,42,.03);border-bottom:1px solid var(--stroke)}
.users-table td{padding:14px 16px;border-bottom:1px solid rgba(255,42,42,.08);vertical-align:middle}
.users-table tr:last-child td{border-bottom:none}
.users-table tr:hover{background:rgba(255,42,42,.02)}
.users-table .mono{font-family:'JetBrains Mono';font-size:12px;color:#e0caca}
.tag{display:inline-block;padding:4px 10px;border-radius:4px;font-family:'JetBrains Mono';font-size:9.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.tag.weekly{background:rgba(255,193,7,.1);color:#ffc107;border:1px solid rgba(255,193,7,.2)}
.tag.monthly{background:rgba(255,42,42,.1);color:var(--acc2);border:1px solid rgba(255,42,42,.2)}
.tag.active{background:rgba(47,224,138,.1);color:#2fe08a;border:1px solid rgba(47,224,138,.2)}
.tag.expired{background:rgba(255,92,92,.1);color:#ff5c5c;border:1px solid rgba(255,92,92,.2)}
.tag.disabled{background:rgba(138,146,168,.1);color:#8a92a8;border:1px solid rgba(138,146,168,.2)}
.row-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--stroke);background:transparent;color:var(--txt);font-family:'JetBrains Mono';font-size:11px;cursor:pointer;transition:all .2s;margin-right:4px}
.row-btn:hover{background:rgba(255,42,42,.1);border-color:var(--acc)}
.row-btn.danger{color:#ff5c5c;border-color:rgba(255,92,92,.3)}
.row-btn.danger:hover{background:rgba(255,92,92,.15);border-color:#ff5c5c}

.recent-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;border:1px solid var(--stroke);border-radius:12px;padding:12px;background:var(--panel)}
.recent-item{display:flex;gap:12px;padding:12px 16px;border:1px solid rgba(255,42,42,.08);border-radius:8px;background:rgba(255,42,42,.02);font-size:12.5px;align-items:center;transition:all .2s}
.recent-item:hover{border-color:var(--stroke)}
.recent-item .type{font-family:'JetBrains Mono';font-size:10px;padding:3px 8px;border-radius:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.recent-item .type.message{background:rgba(255,42,42,.15);color:var(--acc2)}
.recent-item .type.login{background:rgba(47,224,138,.15);color:#2fe08a}
.recent-item .type.signup{background:rgba(139,0,0,.2);color:#ff8a8a}
.recent-item .info{flex:1;color:var(--mut);font-size:11.5px;font-family:'JetBrains Mono'}
.recent-item .when{color:#6e5252;font-family:'JetBrains Mono';font-size:10.5px;white-space:nowrap}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:var(--panel);border:1px solid var(--stroke2);color:#fff;padding:12px 24px;border-radius:100px;font-size:12px;z-index:999;transition:all .3s;opacity:0;font-family:'JetBrains Mono';box-shadow:0 10px 30px rgba(0,0,0,.8)}
.toast.show{transform:translate(-50%,0);opacity:1}

@media(max-width:820px){
  .charts-grid{grid-template-columns:1fr}
  .users-table{font-size:11.5px}
  .users-table th,.users-table td{padding:10px 8px}
  .content{padding:20px 16px}
  .top-bar{padding:12px 16px}
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="glow"></div>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12,2C7.58,2 4,5.58 4,10c0,2.82 1.46,5.3 3.68,6.73C7.87,16.93 8,17.14 8,17.36V19c0,1.66 1.34,3 3,3h2c1.66,0 3-1.34 3-3v-1.64c0-0.22 0.13-0.43 0.32-0.63C18.54,15.3 20,12.82 20,10C20,5.58 16.42,2 12,2z M9.5,12c-1.1,0-2-0.9-2-2s0.9-2,2-2s2,0.9,2,2S10.6,12 9.5,12z M14.5,12c-1.1,0-2-0.9-2-2s0.9-2,2-2s2,0.9,2,2S15.6,12 14.5,12z M12,16c-1.1,0-2-0.9-2-2h4C14,15.1 13.1,16 12,16z"/></svg>
    </div>
    <h1>Fixo Admin</h1>
    <p>Enter root password to continue</p>
    <input id="passInput" type="password" placeholder="••••••••" autocomplete="off" spellcheck="false">
    <button onclick="doLogin()">Authenticate</button>
    <div class="err" id="err"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dash">
  <div class="top-bar">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M12,2C7.58,2 4,5.58 4,10c0,2.82 1.46,5.3 3.68,6.73C7.87,16.93 8,17.14 8,17.36V19c0,1.66 1.34,3 3,3h2c1.66,0 3-1.34 3-3v-1.64c0-0.22 0.13-0.43 0.32-0.63C18.54,15.3 20,12.82 20,10C20,5.58 16.42,2 12,2z"/></svg></span>
      Fixo Control <span class="badge">ROOT</span>
    </div>
    <div class="spacer"></div>
    <button onclick="loadStats()">Refresh Data</button>
    <button onclick="logout()" style="color:#ff5c5c;border-color:rgba(255,92,92,.3)">Logout</button>
  </div>

  <div class="content">
    <div class="section-head"><h2>Overview</h2><div class="line"></div></div>
    <div class="stats-grid" id="statsGrid"></div>

    <div class="section-head"><h2>Traffic Analytics</h2><div class="line"></div></div>
    <div class="charts-grid">
      <div class="chart-card">
        <h3>Pageviews · Last 30 days</h3>
        <div class="bar-chart" id="chart30"></div>
        <div class="chart-meta"><span id="chart30Start">—</span><span id="chart30End">—</span></div>
      </div>
      <div class="chart-card">
        <h3>Pageviews · Last 24 hours</h3>
        <div class="bar-chart" id="chart24"></div>
        <div class="chart-meta"><span id="chart24Start">—</span><span id="chart24End">—</span></div>
      </div>
    </div>

    <div class="section-head"><h2>Live Activity</h2><div class="line"></div></div>
    <div class="recent-list" id="recentList"></div>

    <div class="section-head" style="margin-top:40px"><h2>User Management</h2><div class="line"></div></div>
    <div class="users-controls">
      <input id="newUser" placeholder="Username" spellcheck="false">
      <input id="newPass" type="password" placeholder="Password (min 6 chars)">
      <select id="newPlan">
        <option value="weekly">Weekly Pro ($1.51)</option>
        <option value="monthly">Monthly Pro ($4.52)</option>
      </select>
      <button onclick="createUser()">Create Account</button>
    </div>
    <div style="overflow-x:auto">
      <table class="users-table">
        <thead><tr>
          <th>Username</th><th>Plan</th><th>Created</th><th>Expires</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody id="usersBody"><tr><td colspan="6" style="text-align:center;color:#6e5252;padding:20px;font-family:'JetBrains Mono'">Loading data...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
let adminToken = localStorage.getItem('fixo_admin') || '';

const $ = id => document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString() + ' ' + dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
function daysLeft(d){
  if(!d) return 0;
  return Math.ceil((new Date(d) - new Date()) / 86400000);
}

/* LOGIN */
async function doLogin(){
  const p = $('passInput').value;
  if(!p){$('err').textContent='Enter password';return;}
  try{
    const res = await fetch(API + '/api/admin/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password: p})
    });
    const j = await res.json();
    if(!res.ok){ $('err').textContent = j.error || 'Login failed'; return; }
    adminToken = j.token;
    localStorage.setItem('fixo_admin', adminToken);
    $('loginWrap').style.display = 'none';
    $('dash').classList.add('show');
    loadStats();
    loadUsers();
    toast('Access Granted');
  }catch(e){ $('err').textContent = e.message; }
}
$('passInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

function logout(){
  adminToken='';
  localStorage.removeItem('fixo_admin');
  location.reload();
}

/* STATS */
async function loadStats(){
  try{
    const res = await fetch(API + '/api/admin/stats', {headers:{'x-admin-token':adminToken}});
    if(!res.ok){ if(res.status===401) logout(); return; }
    const s = await res.json();
    renderStats(s);
    renderCharts(s.hourly, s.daily);
    renderRecent(s.recent || []);
  }catch(e){ toast('Stats error: ' + e.message); }
}

function renderStats(s){
  const g = $('statsGrid');
  const items = [
    {lbl:'Pageviews 24h', val:s.pageviews.d1, accent:true},
    {lbl:'Pageviews 7d', val:s.pageviews.d7},
    {lbl:'Pageviews 30d', val:s.pageviews.d30},
    {lbl:'Unique visitors 7d', val:s.unique7d, accent:true},
    {lbl:'Messages 7d', val:s.messages.d7},
    {lbl:'Messages 30d', val:s.messages.d30},
    {lbl:'Active Pro users', val:s.proUsers, sub:'expired: ' + s.expiredUsers},
    {lbl:'Trial sessions', val:s.trialSessions}
  ];
  g.innerHTML = items.map(i =>
    `<div class="stat">
       <div class="lbl">${i.lbl}</div>
       <div class="val ${i.accent?'accent':''}">${i.val}</div>
       ${i.sub?`<div class="sub">${i.sub}</div>`:''}
     </div>`
  ).join('');
}

function renderCharts(hourly, daily){
  const now = new Date();
  const days = [];
  for(let i=29;i>=0;i--){
    const d = new Date(now); d.setDate(d.getDate()-i);
    const k = d.toISOString().slice(0,10);
    const found = daily.find(x=>x._id===k);
    days.push({label:k.slice(5), count: found? found.count:0});
  }
  const maxD = Math.max(1, ...days.map(d=>d.count));
  $('chart30').innerHTML = days.map(d =>
    `<div class="bar" style="height:${Math.max(2, (d.count/maxD)*100)}%" title="${d.label}: ${d.count}"></div>`
  ).join('');
  $('chart30Start').textContent = days[0].label;
  $('chart30End').textContent = days[days.length-1].label;

  const hours = [];
  for(let i=23;i>=0;i--){
    const h = new Date(now.getTime() - i*3600*1000);
    const k = h.toISOString().slice(0,13) + ':00';
    const found = hourly.find(x=>x._id === k);
    hours.push({label: k.slice(11,16), count: found? found.count:0});
  }
  const maxH = Math.max(1, ...hours.map(x=>x.count));
  $('chart24').innerHTML = hours.map(h =>
    `<div class="bar" style="height:${Math.max(2, (h.count/maxH)*100)}%" title="${h.label}: ${h.count}"></div>`
  ).join('');
  $('chart24Start').textContent = hours[0].label;
  $('chart24End').textContent = hours[hours.length-1].label;
}

function renderRecent(list){
  if(!list.length){
    $('recentList').innerHTML = '<div style="text-align:center;color:#6e5252;padding:20px;font-size:12px;font-family:\'JetBrains Mono\'">No recent activity</div>';
    return;
  }
  $('recentList').innerHTML = list.map(r => `
    <div class="recent-item">
      <span class="type ${r.type}">${r.type}</span>
      <span class="info">${r.ip || 'unknown'} · ${r.meta?.username || r.meta?.plan || (r.meta?.pro?'pro':'trial')}</span>
      <span class="when">${fmtDate(r.when)}</span>
    </div>
  `).join('');
}

/* USERS */
async function loadUsers(){
  try{
    const res = await fetch(API + '/api/admin/users', {headers:{'x-admin-token':adminToken}});
    if(!res.ok){ if(res.status===401) logout(); return; }
    const users = await res.json();
    const body = $('usersBody');
    if(!users.length){
      body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#6e5252;padding:24px;font-family:\'JetBrains Mono\'">No users found</td></tr>';
      return;
    }
    body.innerHTML = users.map(u => {
      const dl = daysLeft(u.expiresAt);
      const statusTag = !u.active
        ? '<span class="tag disabled">disabled</span>'
        : (u.expired ? '<span class="tag expired">expired</span>' : `<span class="tag active">${dl}d left</span>`);
      return `<tr>
        <td class="mono">${esc(u.username)}</td>
        <td><span class="tag ${u.plan}">${u.plan}</span></td>
        <td class="mono">${fmtDate(u.createdAt)}</td>
        <td class="mono">${fmtDate(u.expiresAt)}</td>
        <td>${statusTag}</td>
        <td>
          ${u.active
            ? `<button class="row-btn danger" onclick="toggleUser('${u.id}', false)">Disable</button>`
            : `<button class="row-btn" onclick="toggleUser('${u.id}', true)">Enable</button>`}
          <button class="row-btn" onclick="extendUser('${u.id}', '${u.username}')">+7d</button>
          <button class="row-btn danger" onclick="deleteUser('${u.id}', '${esc(u.username)}')">Delete</button>
        </td>
      </tr>`;
    }).join('');
  }catch(e){ toast('Users error: ' + e.message); }
}

async function createUser(){
  const username = $('newUser').value.trim();
  const password = $('newPass').value;
  const plan = $('newPlan').value;
  if(!username || !password){ toast('Fill username and password'); return; }
  if(password.length < 6){ toast('Password must be 6+ chars'); return; }
  try{
    const res = await fetch(API + '/api/admin/users', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-admin-token':adminToken},
      body: JSON.stringify({username, password, plan})
    });
    const j = await res.json();
    if(!res.ok){ toast(j.error || 'Create failed'); return; }
    toast('Created ' + username + ' · ' + plan);
    $('newUser').value = '';
    $('newPass').value = '';
    loadUsers();
    loadStats();
  }catch(e){ toast('Error: ' + e.message); }
}

async function toggleUser(id, active){
  try{
    await fetch(API + '/api/admin/users/' + id, {
      method:'PATCH',
      headers:{'Content-Type':'application/json','x-admin-token':adminToken},
      body: JSON.stringify({active})
    });
    toast(active?'Enabled':'Disabled');
    loadUsers();
  }catch(e){ toast('Error: '+e.message); }
}

async function extendUser(id, name){
  try{
    await fetch(API + '/api/admin/users/' + id, {
      method:'PATCH',
      headers:{'Content-Type':'application/json','x-admin-token':adminToken},
      body: JSON.stringify({extendDays: 7})
    });
    toast('Extended ' + name + ' by 7 days');
    loadUsers();
  }catch(e){ toast('Error: '+e.message); }
}

async function deleteUser(id, name){
  if(!confirm('Delete ' + name + '? This cannot be undone.')) return;
  try{
    await fetch(API + '/api/admin/users/' + id, {
      method:'DELETE',
      headers:{'x-admin-token':adminToken}
    });
    toast('Deleted ' + name);
    loadUsers();
    loadStats();
  }catch(e){ toast('Error: '+e.message); }
}

/* BOOT */
if(adminToken){
  fetch(API + '/api/admin/stats', {headers:{'x-admin-token':adminToken}})
    .then(r => {
      if(r.ok){
        $('loginWrap').style.display = 'none';
        $('dash').classList.add('show');
        loadStats(); loadUsers();
      } else {
        localStorage.removeItem('fixo_admin');
      }
    }).catch(()=>{});
}

setInterval(()=>{
  if($('dash').classList.contains('show')) loadStats();
}, 30000);
</script>
